<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Еко-Аналітика</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151d30;
            --text-color: #f3f4f6;
            --accent-blue: #38bdf8;
            --accent-orange: #f97316;
            --accent-green: #10b981;
            --border-color: #1e293b;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: var(--text-color);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h2 {
            margin: 0 0 15px 0;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        .btn {
            background: var(--accent-blue);
            color: #000;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            display: inline-block;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.7);
        }

        .btn:disabled {
            background: #1e293b;
            color: #64748b;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .widgets {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
        }

        .card p {
            margin: 0;
            font-size: 32px;
            font-weight: 700;
            color: #fff;
        }

        /* Кольорові індикатори для карток */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
        }
        .card-t::before { background: var(--accent-blue); }
        .card-h::before { background: #a855f7; }
        .card-p::before { background: #6366f1; }
        .card-i::before { background: var(--accent-green); }

        .chart-container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        canvas {
            display: block;
            width: 100%;
            background: #0f172a;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>Моніторинг Повітря</h2>
        <button class="btn" id="connectBtn">Підключити Arduino</button>
    </header>

    <div class="widgets">
        <div class="card card-t"><h3>Температура</h3><p id="tVal">-- °C</p></div>
        <div class="card card-h"><h3>Вологість</h3><p id="hVal">-- %</p></div>
        <div class="card card-p"><h3>Тиск</h3><p id="pVal">-- гПа</p></div>
        <div class="card card-i"><h3>Якість (IAQ)</h3><p id="iVal">--</p></div>
    </div>

    <div class="chart-container">
        <canvas id="customChart" width="800" height="300"></canvas>
    </div>
</div>

<script>
    const connectBtn = document.getElementById('connectBtn');
    let port, reader;

    // Масиви для збереження історії даних
    let iaqHistory = [];
    let tempHistory = [];
    const maxPoints = 40; // Скільки точок показувати на графіку

    // Налаштування власного Canvas графіка
    const canvas = document.getElementById('customChart');
    const ctx = canvas.getContext('2d');

    function drawChart() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Малюємо сітку
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 1;
        for (let i = 1; i < 5; i++) {
            let y = (canvas.height / 5) * i;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
            ctx.stroke();
        }

        if (iaqHistory.length < 2) return;

        const stepX = canvas.width / (maxPoints - 1);

        // Функція для малювання однієї лінії
        function drawLine(data, color, minVal, maxVal) {
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.shadowBlur = 10;
            ctx.shadowColor = color;

            for (let i = 0; i < data.length; i++) {
                let x = i * stepX;
                // Нормалізація значень під висоту екрана
                let normY = (data[i] - minVal) / (maxVal - minVal || 1);
                let y = canvas.height - (normY * (canvas.height - 40) + 20);

                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            ctx.shadowBlur = 0; // Скидаємо тінь
        }

        // Малюємо лінію IAQ (Помаранчево-зелена, шкала 0-500)
        drawLine(iaqHistory, '#10b981', 0, 500);
        // Малюємо лінію Температури (Синя, шкала 0-50)
        drawLine(tempHistory, '#38bdf8', 0, 50);
    }

    // Запуск первинного пустого графіка
    drawChart();

    // Логіка підключення
    connectBtn.addEventListener('click', async () => {
        if (!("serial" in navigator)) {
            alert("Помилка безпеки: Ваш браузер блокує Web Serial. Переконайтеся, що використовуєте Chrome/Edge та відкриваєте сторінку через локальний сервер (а не просто подвійним кліком по файлу)!");
            return;
        }

        try {
            port = await navigator.serial.requestPort();
            await port.open({ baudRate: 115200 });
            
            connectBtn.innerText = "З'ЄДНАНО ";
            connectBtn.style.boxShadow = "0 0 15px rgba(16, 185, 129, 0.4)";
            connectBtn.style.background = "var(--accent-green)";
            connectBtn.disabled = true;

            const textDecoder = new TextDecoderStream();
            port.readable.pipeTo(textDecoder.writable);
            reader = textDecoder.readable.getReader();

            let bufferStr = "";

            while (true) {
                const { value, done } = await reader.read();
                if (done) { reader.releaseLock(); break; }
                
                if (value) {
                    bufferStr += value;
                    let lines = bufferStr.split("\n");
                    bufferStr = lines.pop(); 

                    for (let line of lines) {
                        line = line.trim();
                        if (!line) continue;

                        try {
                            const data = JSON.parse(line);

                            // Оновлюємо тексти
                            if(data.temp !== undefined) document.getElementById('tVal').innerText = data.temp + " °C";
                            if(data.hum !== undefined)  document.getElementById('hVal').innerText = data.hum + " %";
                            if(data.press !== undefined) document.getElementById('pVal').innerText = data.press + " гПа";
                            if(data.iaq !== undefined)   document.getElementById('iVal').innerText = data.iaq;

                            // Записуємо в масиви для графіка
                            if(data.iaq !== undefined) iaqHistory.push(Number(data.iaq));
                            if(data.temp !== undefined) tempHistory.push(Number(data.temp));

                            // Обмежуємо довжину історії
                            if (iaqHistory.length > maxPoints) iaqHistory.shift();
                            if (tempHistory.length > maxPoints) tempHistory.shift();

                            // Перемальовуємо графік
                            drawChart();
                        } catch (e) {
                            // Пропускаємо незавершені пакети даних
                        }
                    }
                }
            }
        } catch (error) {
            alert("Не вдалося підключитися: " + error.message);
        }
    });
</script>
</body>
</html>
